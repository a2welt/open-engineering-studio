[project]
name = "repo-xray"
version = "0.1.0"
description = "Repo X-Ray: import graph, architecture layers and change impact for Python and TypeScript repositories."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Open Engineering Studio contributors" }]
keywords = ["architecture", "dependency-graph", "impact-analysis", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
]
# No runtime dependencies: the analyzer, CLI and HTTP endpoint use the standard library only.
dependencies = []

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.17.1",
  "mypy==2.4.0",
]

[project.scripts]
xray = "repo_xray.cli:main"

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_xray"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF", "SIM", "PT"]
ignore = [
  "S101", # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = ["src"]
packages = ["repo_xray"]
warn_unused_ignores = true

[tool.coverage.run]
source = ["src/repo_xray"]
